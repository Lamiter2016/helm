global:
  environment: staging
  namespace:
    create: false
    name: ""
    labels: {}
    annotations: {}

replicaCount: 3

revisionHistoryLimit: 5

image:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 25%
    maxSurge: 25%

topologySpreadConstraints: []

priorityClassName: ""

terminationGracePeriodSeconds: 30

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300

pdb:
  enabled: true
  minAvailable: 2

networkPolicy:
  enabled: true
  defaultDeny: true
  ingress:
    allowFromNamespaces: []
  egress:
    allowToNamespaces: []
    allowDNS: true

serviceMonitor:
  enabled: false
  interval: 15s
  path: /metrics

ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts: []
  tls: []
